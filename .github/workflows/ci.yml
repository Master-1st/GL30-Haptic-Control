name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: TypeScript and no-hardware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check generated protocol vectors are current
        run: git diff --exit-code -- protocol/generated/v1.json

  stm32-host:
    name: STM32 host (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            build_type: Debug
            c_flags: '-Wall -Wextra'
            ipo: 'OFF'
          - profile: sanitizer
            build_type: Debug
            c_flags: '-Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer'
            ipo: 'OFF'
          - profile: release-lto
            build_type: Release
            c_flags: ''
            ipo: 'ON'
    steps:
      - uses: actions/checkout@v7

      # H25's frozen source manifest remains a gate for H25 live runners, not
      # a claim that this newer, offline-only source has H25 qualification.

      - name: Configure
        run: >-
          cmake -S firmware-stm32/tests -B build/stm32-host
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="${{ matrix.c_flags }}"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.ipo }}

      - name: Build
        run: cmake --build build/stm32-host --parallel 2

      - name: Test
        run: ctest --test-dir build/stm32-host --output-on-failure

      - name: Configure current ESP32 UI, motor link and settings regressions
        run: >-
          cmake -S firmware-esp32/ui/kk-preview -B build/esp-current
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="${{ matrix.c_flags }}"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.ipo }}

      - name: Build and test current ESP32 source without hardware
        run: |
          cmake --build build/esp-current --parallel 2
          ctest --test-dir build/esp-current --output-on-failure

      - name: Configure UI animation model (no ESP or display required)
        run: >-
          cmake -S firmware-esp32/ui/tests -B build/esp-ui-model
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="${{ matrix.c_flags }}"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.ipo }}

      - name: Build and test UI animation model
        run: |
          cmake --build build/esp-ui-model --parallel 2
          ctest --test-dir build/esp-ui-model --output-on-failure

  encoder-viewer:
    name: Encoder viewer offline unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and test without opening serial or UI
        shell: powershell
        run: .\firmware-stm32\bench\NUCLEO_G474RE_FOC\encoder-viewer\Open_Encoder_Viewer.ps1 -Check
