name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: TypeScript and no-hardware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check generated protocol vectors are current
        run: git diff --exit-code -- protocol/generated/v1.json

  stm32-host:
    name: STM32 portable core host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S firmware-stm32/tests -B build/stm32-host -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/stm32-host --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build/stm32-host -C Debug --output-on-failure
